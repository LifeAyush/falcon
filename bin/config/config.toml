[core]
listen = 8000
apiport = 9900
enableServerStats = true
healthIntervalMs = 3000
healthTimeoutMs = 1000

# [limitReq]
# enable = true
# interval = 1000
# frequency = 100

[proxy]

[[proxy.routes]]
endpoint = "/hello"
match = 1
balancer = 0

[[proxy.routes.backends]]
url = "http://localhost:3001"
varName = "hello_a"
weight = 1
healthPath = "/health"

[[proxy.routes.backends]]
url = "http://localhost:3002"
varName = "hello_b"
weight = 1
healthPath = "/health"

[[proxy.routes]]
endpoint = "/world"
match = 1
balancer = 2

[[proxy.routes.backends]]
url = "http://localhost:3003"
varName = "world_a"
weight = 1
healthPath = "/health"

[[proxy.routes.backends]]
url = "http://localhost:3004"
varName = "world_b"
weight = 2
healthPath = "/health"

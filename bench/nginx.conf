# Baseline reverse proxy for bench/run.sh. Tuned the way a production nginx
# in front of one upstream usually is: keep-alive to the upstream, no logs.
worker_processes auto;
error_log stderr warn;
pid nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream backend {
        server 127.0.0.1:3101;
        keepalive 256;
    }

    server {
        listen 8200;
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
